<!doctype html>
<html>
    <head>
        <link rel="icon" href="data:=" />
        <meta name="color-scheme" content="dark light" />
        <title>mdl demo</title>
        <link
            rel="stylesheet"
            href="https://cdn.simplecss.org/simple.min.css"
        />
        <style>
            :root {
                --accent: lightblue;
            }
        </style>
        <script src="/mdl.js"></script>
    </head>

    <body>
        <main>
            <h1>Projects</h1>

            <div class="toolbar">
                <button
                    onclick="
                        projects.add({
                            id: uid(),
                            name: 'New project',
                            tasks: [],
                        })
                    "
                >
                    Add project
                </button>
            </div>

            <!-- Outer component: one per project -->
            <template mdl="projects">
                <section class="project">
                    <header>
                        <h4 mdl="name"></h4>
                        <button mdl="store.remove(item.id)">x</button>
                    </header>

                    <p>
                        <label>
                            Name
                            <input type="text" mdl="name" />
                        </label>
                    </p>

                    <p>
                        <label>
                            Description
                            <textarea mdl="description"></textarea>
                        </label>
                    </p>

                    <!-- Inner component: resolves against this project's `tasks` child store -->
                    <template mdl="tasks">
                        <div class="task">
                            <input type="checkbox" mdl="complete" />
                            <input type="text" mdl="text" />
                            <input type="number" mdl="remaining" />
                            <select mdl="status">
                                <option>Delayed</option>
                                <option>On target</option>
                            </select>
                            <button mdl="store.remove(item.id)">x</button>
                        </div>
                    </template>

                    <button
                        mdl="item.tasks.add({ id: uid(), text: 'New task', remaining: 1, complete: false })"
                    >
                        Add task
                    </button>
                    <button
                        mdl="for (var task of item.tasks) task.complete = true;"
                    >
                        All done
                    </button>
                </section>
            </template>

            <table>
                <thead>
                    <tr>
                        <th>Project</th>
                        <th>Task</th>
                        <th>Status</th>
                        <th>Remaining</th>
                        <th>Complete</th>
                    </tr>
                </thead>

                <tbody>
                    <template mdl="projects">
                        <template mdl="tasks">
                            <tr>
                                <td mdl="$parent.name"></td>
                                <td mdl="text"></td>
                                <td mdl="status"></td>
                                <td mdl="remaining"></td>
                                <td mdl="complete"></td>
                            </tr>
                        </template>
                    </template>
                </tbody>
            </table>
        </main>
    </body>

    <script>
        var nextId = 100;
        const uid = () => String(nextId++);

        // Must be var to work, in modules use mdl.register({ projects })
        var projects = store([
            {
                id: uid(),
                name: "Home",
                description: "foo",
                tasks: [
                    {
                        id: uid(),
                        text: "Take out trash",
                        remaining: 1,
                        complete: false,
                    },
                    {
                        id: uid(),
                        text: "Do laundry",
                        remaining: 1,
                        complete: true,
                    },
                ],
            },
            {
                id: uid(),
                name: "Work",
                description: "bar",
                tasks: [
                    {
                        id: uid(),
                        text: "Finish a project",
                        remaining: 1,
                        complete: false,
                    },
                    {
                        id: uid(),
                        text: "Reply to email",
                        remaining: 1,
                        complete: false,
                    },
                    {
                        id: uid(),
                        text: "Write docs",
                        remaining: 1,
                        status: "On target",
                        complete: false,
                    },
                ],
            },
        ]);
    </script>
</html>

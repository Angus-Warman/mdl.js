<!doctype html>
<html>
    <head>
        <link rel="icon" href="data:=" />
        <meta name="color-scheme" content="dark light" />
        <title>mdl demo: projects &amp; tasks</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                max-width: 40rem;
                margin: 2rem auto;
                padding: 0 1rem;
            }
            .project {
                border: 1px solid #8884;
                border-radius: 8px;
                padding: 0.75rem 1rem;
                margin-bottom: 1rem;
            }
            .project > header {
                font-weight: 600;
                margin-bottom: 0.5rem;
            }
            .task {
                display: flex;
                gap: 0.5rem;
                align-items: center;
                margin: 0.25rem 0;
            }
            .task input[type="text"] {
                flex: 1;
            }
            .toolbar {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
                margin-bottom: 1.5rem;
            }
        </style>
        <script src="/mdl.js"></script>
    </head>

    <body>
        <main>
            <h1>Projects</h1>

            <div class="toolbar">
                <button onclick="addProject()">Add project</button>
                <button onclick="addTaskToLast()">
                    Add task to last project
                </button>
                <button onclick="completeAll()">Complete everything</button>
                <button onclick="renameFirst()">
                    Rename first project (from code)
                </button>
                <button onclick="removeLast()">Remove last project</button>
            </div>

            <!-- Outer component: one per project -->
            <template mdl="projects">
                <section class="project">
                    <header>
                        <h4 mdl="name"></h4>
                    </header>

                    <input type="text" mdl="name" />

                    <!-- Inner component: resolves against this project's `tasks` child store -->
                    <template mdl="tasks">
                        <div class="task">
                            <input type="checkbox" mdl="complete" />
                            <input type="text" mdl="text" />
                        </div>
                    </template>

                    <button mdl="for (var task of item.tasks) task.complete = true;">All done</button>
                </section>
            </template>
        </main>
    </body>

    <script>
        var nextId = 100;
        const uid = () => String(nextId++);

        const projects = store("projects", [
            {
                id: uid(),
                name: "Home",
                tasks: [
                    { id: uid(), text: "Take out trash", complete: false },
                    { id: uid(), text: "Do laundry", complete: true },
                ],
            },
            {
                id: uid(),
                name: "Work",
                tasks: [
                    { id: uid(), text: "Finish a project", complete: false },
                    { id: uid(), text: "Reply to email", complete: false },
                    { id: uid(), text: "Write docs", complete: false },
                ],
            },
        ]);

        function lastProject() {
            return [...projects].at(-1);
        }

        function addProject() {
            projects.add({ id: uid(), name: "New project", tasks: [] });
        }

        function addTaskToLast() {
            const project = lastProject();
            if (!project) return;
            project.tasks.add({ id: uid(), text: "New task", complete: false });
        }

        function completeAll() {
            for (const project of projects) {
                for (const task of project.tasks) {
                    task.complete = true;
                }
            }
        }

        function renameFirst() {
            const first = [...projects][0];
            if (first) first.name = "Home (renamed)";
        }

        function removeLast() {
            const project = lastProject();
            if (project) projects.remove(project.id);
        }
    </script>
</html>

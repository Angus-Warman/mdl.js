<!doctype html>
<html>
    <head>
        <link rel="icon" href="data:=" />
        <meta name="color-scheme" content="dark light" />
        <title>mdl demo</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                max-width: 40rem;
                margin: 2rem auto;
                padding: 0 1rem;
            }
            .project {
                border: 1px solid #8884;
                border-radius: 8px;
                padding: 0.75rem 1rem;
                margin-bottom: 1rem;
            }
            .project > header {
                font-weight: 600;
                margin-bottom: 0.5rem;
            }
            .task {
                display: flex;
                gap: 0.5rem;
                align-items: center;
                margin: 0.25rem 0;
            }
            .task input[type="text"] {
                flex: 1;
            }
            .toolbar {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
                margin-bottom: 1.5rem;
            }
        </style>
        <script src="/mdl.js"></script>
    </head>

    <body>
        <main>
            <h1>Projects</h1>

            <div class="toolbar">
                <button onclick='projects.add({ id: uid(), name: "New project", tasks: [] });'>Add project</button>
            </div>

            <!-- Outer component: one per project -->
            <template mdl="projects">
                <section class="project">
                    <header>
                        <h4 mdl="name"></h4>
                        <button mdl="store.remove(item.id)">x</button>
                    </header>

                    <label>
                        Name
                        <input type="text" mdl="name" />
                    </label>

                    <label>
                        Description
                        <textarea mdl="description"></textarea>
                    </label>

                    <!-- Inner component: resolves against this project's `tasks` child store -->
                    <template mdl="tasks">
                        <div class="task">
                            <input type="checkbox" mdl="complete" />
                            <input type="text" mdl="text" />
                            <select mdl="status">
                                <option>Delayed</option>
                                <option>On target</option>
                            </select>
                            <button mdl="store.remove(item.id)">x</button>
                        </div>
                    </template>

                    <button mdl="item.tasks.add({ id: uid(), text: 'New task', complete: false })">Add task</button>
                    <button mdl="for (var task of item.tasks) task.complete = true;">All done</button>
                </section>
            </template>
        </main>
    </body>

    <script>
        var nextId = 100;
        const uid = () => String(nextId++);

        // Must be var to work, in modules use mdl.register({ projects })
        var projects = store([
            {
                id: uid(),
                name: "Home",
                description: "foo",
                tasks: [
                    { id: uid(), text: "Take out trash", complete: false },
                    { id: uid(), text: "Do laundry", complete: true },
                ],
            },
            {
                id: uid(),
                name: "Work",
                description: "bar",
                tasks: [
                    { id: uid(), text: "Finish a project", complete: false },
                    { id: uid(), text: "Reply to email", complete: false },
                    { id: uid(), text: "Write docs", status: "On target", complete: false },
                ],
            },
        ]);
    </script>
</html>
